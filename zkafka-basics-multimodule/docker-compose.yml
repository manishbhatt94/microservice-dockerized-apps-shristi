networks:
    my-kafka-network:

services:
    zookeeper-service:
        image: confluentinc/cp-zookeeper:7.4.0
        ports:
            - 2181:2181
        networks:
            - my-kafka-network
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000

    kafka-service:
        image: confluentinc/cp-kafka:7.4.0
        ports:
            - 9092:9092
            - 9094:9094
        networks:
            - my-kafka-network
        depends_on:
            - zookeeper-service
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper-service:2181
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092,PLAINTEXT_HOST://localhost:9094
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    order-producer-service:
        build:
            context: .
            dockerfile: ./zkafka-basics-producer/Dockerfile
        image: order-producer-image
        container_name: order-producer-container
        ports:
            - 8091:8091
        depends_on:
            - kafka-service
        networks:
            - my-kafka-network

    order-consumer-service:
        build:
            context: .
            dockerfile: ./zkafka-basics-consumer/Dockerfile
        image: order-consumer-image
        container_name: order-consumer-container
        ports:
            - 8092:8092
        depends_on:
            - kafka-service
        networks:
            - my-kafka-network
