spring:
    application:
        name: product-cart
    config:
        import:
            - configserver:http://config-server:8888
    profiles:
        default: default
        active:
            - dev

server:
    port: 8084

management:
    health:
        defaults:
            enabled: true
        circuitbreakers:
            enabled: true
    endpoints:
        web:
            exposure:
                include:
                    - "*"
    endpoint:
        health:
            show-details: always
            show-components: always
        circuitbreakers:
            enabled: true

resilience4j.circuitbreaker:
    instances:
        cartService:
            registerHealthIndicator: true
            # Add these for easier testing:
            slidingWindowSize: 10
            minimumNumberOfCalls: 5
            failureRateThreshold: 50
            waitDurationInOpenState: 10s
            permittedNumberOfCallsInHalfOpenState: 2
