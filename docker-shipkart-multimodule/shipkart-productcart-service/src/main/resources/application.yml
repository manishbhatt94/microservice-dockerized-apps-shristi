spring:
    application:
        name: product-cart
    config:
        import:
            - configserver:http://config-server:8888
    profiles:
        default: default
        active:
            - dev
    kafka:
        producer:
            bootstrap-servers:
                - kafka-service:9092 # Name of the kafka service in docker compose.
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            properties:
                "[spring.json.add.type.headers]": false # Stops producer from adding __TypeId__ header.

server:
    port: 8084

management:
    health:
        defaults:
            enabled: true
        circuitbreakers:
            enabled: true
    endpoints:
        web:
            exposure:
                include:
                    - "*"
    endpoint:
        health:
            show-details: always
            show-components: always
        circuitbreakers:
            enabled: true

resilience4j.circuitbreaker:
    instances:
        cartService:
            registerHealthIndicator: true
            # Add these for easier testing:
            slidingWindowSize: 10
            minimumNumberOfCalls: 5
            failureRateThreshold: 50
            waitDurationInOpenState: 10s
            permittedNumberOfCallsInHalfOpenState: 2

kafka-topic-names:
    order-placed: order-placed-events
